name: CampusFind CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check required project files
        run: |
          test -f CampusFind/index.html
          test -f CampusFind/listings.html
          test -f CampusFind/report.html
          test -f CampusFind/styles.css
          test -f CampusFind/app.js
          test -f CampusFind/Dockerfile

      - name: Build Docker image
        run: docker build -t campusfind ./CampusFind
